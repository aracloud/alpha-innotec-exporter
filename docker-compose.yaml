services:
  lw251-exporter:
    image: ghcr.io/aracloud/alpha-innotec-lw251-exporter:latest
    container_name: lw251-exporter
    restart: always
    ports:
      - "8888:8888"
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8888"
      HEATPUMP_HOST: "192.168.1.100"
      HEATPUMP_PORT: "8214"
